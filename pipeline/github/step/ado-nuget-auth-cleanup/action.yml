name: Remove Azure DevOps NuGet sources
description: |
  Removes the NuGet sources registered by `ado-nuget-auth`. Call it with `if: always()` at the
  end of a job on a self-hosted runner, so the token does not outlive the job.

inputs:
  source-name:
    description: Name given to `ado-nuget-auth`. Removes `<source-name>`, `<source-name>-2`, and so on.
    required: false
    default: ado
  config-file:
    description: Path of the NuGet.Config given to `ado-nuget-auth`. Empty means the user-level config.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Remove NuGet sources
      shell: pwsh
      env:
        SOURCE_NAME: ${{ inputs.source-name }}
        CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        $params = @{ SourceName = $env:SOURCE_NAME }
        if ($env:CONFIG_FILE) { $params.ConfigFile = $env:CONFIG_FILE }
        & "$env:GITHUB_ACTION_PATH/../../../../scripts/nuget/Remove-AdoNuGetSource.ps1" @params
