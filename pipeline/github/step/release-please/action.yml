name: Run release-please with retry
description: |
  Wraps `googleapis/release-please-action` behind a GitHub App-issued token so the
  release PR is authored by the App (which lets it trigger downstream CI), with one
  automatic retry to absorb transient API hiccups.

  Pre-creates the version tag from `.release-please-manifest.json` if missing.
  This works around https://github.com/googleapis/release-please/issues/1650:
  when `draft: true` is set in the release-please config, the GitHub Release is
  created in draft mode and its underlying git tag is materialised lazily (only
  on publish). release-please-action runs twice in the same call (cut the
  release for the merged release-please PR, then compute the next PR), so the
  second pass can't see the just-drafted release, walks history from the start,
  and opens a duplicate "next" PR re-listing every already-released commit.
  Pre-materialising the tag fixes the boundary detection.

  Outputs `release_created`, `tag_name`, and `pr` so the calling workflow can gate
  follow-on jobs (build, sign, attach assets, publish, etc.) on whether release-please
  actually cut a release.

inputs:
  app-id:
    description: GitHub App ID for release-please.
    required: true
  app-private-key:
    description: GitHub App private key (PEM).
    required: true
  config-file:
    description: Path to release-please-config.json. Defaults to repo root.
    required: false
    default: release-please-config.json
  manifest-file:
    description: Path to .release-please-manifest.json. Defaults to repo root.
    required: false
    default: .release-please-manifest.json

outputs:
  release_created:
    description: '"true" if release-please cut a release this run.'
    value: ${{ steps.merge.outputs.release_created }}
  tag_name:
    description: Tag name for the released version (empty if no release).
    value: ${{ steps.merge.outputs.tag_name }}
  pr:
    description: JSON describing the open release PR (if any).
    value: ${{ steps.merge.outputs.pr }}

runs:
  using: composite
  steps:
    - id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}

    # Pre-materialise the manifest's tag if missing. See the description above
    # for why this is needed when `draft: true` is in the release-please config.
    # Idempotent: skipped when the tag already exists, or when the manifest
    # doesn't exist yet (first-run bootstrap before release-please ever ran).
    - name: Pre-create release tag if missing
      uses: actions/github-script@v8
      env:
        MANIFEST_FILE: ${{ inputs.manifest-file }}
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const manifestPath = process.env.MANIFEST_FILE;
          const tagPrefix = 'v';
          const manifestPackage = '.';

          let manifestData;
          try {
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: manifestPath,
              ref: context.sha,
            });
            const content = Buffer.from(data.content, data.encoding || 'base64').toString('utf8');
            manifestData = JSON.parse(content);
          } catch (error) {
            if (error.status === 404) {
              core.info(`Manifest '${manifestPath}' not found at ${context.sha}; skipping pre-tag (first-run bootstrap).`);
              return;
            }
            throw error;
          }

          const rawVersion = manifestData[manifestPackage];
          if (!rawVersion) {
            core.info(`Manifest has no entry for package '${manifestPackage}'; skipping pre-tag.`);
            return;
          }

          const tagVersion = `${tagPrefix}${rawVersion}`;
          core.info(`Manifest version: ${rawVersion} -> tag ${tagVersion}`);

          try {
            await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tagVersion}`,
            });
            core.info(`Tag ${tagVersion} already exists; nothing to do.`);
            return;
          } catch (error) {
            if (error.status !== 404) {
              core.setFailed(`Tag verification failed: HTTP ${error.status} ${error.message}`);
              return;
            }
          }

          try {
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagVersion}`,
              sha: context.sha,
            });
            core.notice(`Pre-created tag ${tagVersion} -> ${context.sha} so release-please can find the boundary.`);
          } catch (error) {
            core.setFailed(`Tag creation failed: HTTP ${error.status} ${error.message}`);
          }

    - id: attempt-1
      uses: googleapis/release-please-action@v5
      continue-on-error: true
      with:
        token: ${{ steps.app-token.outputs.token }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}

    - if: steps.attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 15

    - id: attempt-2
      if: steps.attempt-1.outcome == 'failure'
      uses: googleapis/release-please-action@v5
      with:
        token: ${{ steps.app-token.outputs.token }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}

    - id: merge
      shell: bash
      env:
        A1_OUTCOME: ${{ steps.attempt-1.outcome }}
        A1_RELEASE: ${{ steps.attempt-1.outputs.release_created }}
        A1_TAG: ${{ steps.attempt-1.outputs.tag_name }}
        A1_PR: ${{ steps.attempt-1.outputs.pr }}
        A2_RELEASE: ${{ steps.attempt-2.outputs.release_created }}
        A2_TAG: ${{ steps.attempt-2.outputs.tag_name }}
        A2_PR: ${{ steps.attempt-2.outputs.pr }}
      run: |
        if [ "$A1_OUTCOME" = "success" ]; then
          {
            echo "release_created=$A1_RELEASE"
            echo "tag_name=$A1_TAG"
            printf 'pr<<EOF\n%s\nEOF\n' "$A1_PR"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "release_created=$A2_RELEASE"
            echo "tag_name=$A2_TAG"
            printf 'pr<<EOF\n%s\nEOF\n' "$A2_PR"
          } >> "$GITHUB_OUTPUT"
        fi
