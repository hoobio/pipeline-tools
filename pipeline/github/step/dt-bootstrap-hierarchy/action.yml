name: Bootstrap Dependency-Track hierarchy
description: |
  Idempotently creates the Backstage-style Dependency-Track project hierarchy
  (domain -> system -> component -> channel [-> sub-channel]) above per-build
  SBOM uploads.

  Layout produced (default classifier PLATFORM):

      <domain>          @ "domain"        (root)
      <system>          @ "system"        (parent: <domain>@domain)
      <component>       @ "component"     (parent: <system>@system)
      <component>       @ <channel>       (parent: <component>@component)
      <component>       @ <sub-channel>   (parent: <component>@<channel>)   [optional]

  Sub-channel is used to group CI builds from non-default branches under a
  shared "ci" channel - typical layouts:

      release builds   : domain/system/component@component/component@release
      default branch   : domain/system/component@component/component@<default-branch>
      feature branches : domain/system/component@component/component@ci/component@<branch>
      hotfix (gitflow) : domain/system/component@component/component@hotfix/component@<hotfix-id>

  Each grouping node is created with the desired classifier and collection-logic;
  if the node already exists with different values, the script PATCHes it back into
  shape. The first run requires the API key to have PORTFOLIO_MANAGEMENT
  (PUT /api/v1/project, PATCH /api/v1/project/{uuid}); subsequent no-op runs only
  need PROJECT_CREATION_UPLOAD because the create and patch paths are skipped.

inputs:
  server-url:
    description: Dependency-Track server URL including scheme.
    required: true
  api-key:
    description: |
      Dependency-Track API key. Needs PORTFOLIO_MANAGEMENT on the first run (or
      whenever drift correction is required), then PROJECT_CREATION_UPLOAD is
      enough for steady-state no-op runs.
    required: true
  domain:
    description: Top-level grouping (Backstage domain).
    required: true
  system:
    description: Mid-level grouping (Backstage system).
    required: true
  component:
    description: |
      Component name. Reused as the project name for the component umbrella and the
      channel umbrella so all per-build SBOM uploads share one DT project name.
    required: true
  channel:
    description: |
      Channel below the component, e.g. "release", "prerelease", "<default-branch>",
      "ci", or "hotfix". Created as `<component>@<channel>` linked to the component
      umbrella.
    required: true
  sub-channel:
    description: |
      Optional fifth-level bucket below the channel. Typical use: channel="ci" with
      sub-channel="<branch-name>" so non-default-branch CI builds group under a
      shared "ci" umbrella but each branch keeps its own SBOM history. Pass empty
      to skip.

      When invoked with this v2 sub-channel pattern, the bootstrap also auto-migrates
      any legacy v1 `<component>@ci/<sub-channel>` umbrella into the new structure
      (re-parents children, deletes the empty legacy). Always-on, idempotent.
    required: false
    default: ''
  classifier:
    description: |
      DT project classifier applied to every grouping node. Defaults to PLATFORM,
      which matches the role of these nodes (umbrellas, not real applications).
      Valid values: APPLICATION, FRAMEWORK, LIBRARY, CONTAINER, OPERATING_SYSTEM,
      DEVICE, FIRMWARE, FILE, PLATFORM, DEVICE_DRIVER, MACHINE_LEARNING_MODEL,
      DATA, CRYPTOGRAPHIC_ASSET.
    required: false
    default: PLATFORM
  domain-collection-logic:
    description: |
      Collection logic applied to the domain umbrella. Defaults to
      AGGREGATE_DIRECT_CHILDREN. Valid values: NONE, AGGREGATE_DIRECT_CHILDREN,
      AGGREGATE_DIRECT_CHILDREN_WITH_TAG, AGGREGATE_LATEST_VERSION_CHILDREN.
    required: false
    default: AGGREGATE_DIRECT_CHILDREN
  system-collection-logic:
    description: |
      Collection logic applied to the system umbrella. Defaults to
      AGGREGATE_DIRECT_CHILDREN.
    required: false
    default: AGGREGATE_DIRECT_CHILDREN
  component-collection-logic:
    description: |
      Collection logic applied to the component umbrella. Defaults to
      AGGREGATE_DIRECT_CHILDREN, summing across every channel under the
      component. AGGREGATE_LATEST_VERSION_CHILDREN would be ideal in theory
      (pick the canonical channel), but DT's isLatest flag is keyed by project
      name and our umbrellas share the project name with their per-build
      children, so the latest-version logic collapses to zero at the component
      view. Summing direct children avoids that, at the cost of overcounting
      when the same SHA exists in multiple channels (rare; bounded).
    required: false
    default: AGGREGATE_DIRECT_CHILDREN
  channel-collection-logic:
    description: |
      Collection logic applied to the channel umbrella. Defaults to
      AGGREGATE_LATEST_VERSION_CHILDREN, so the channel view rolls up only the
      latest per-build SBOM upload.
    required: false
    default: AGGREGATE_LATEST_VERSION_CHILDREN
  sub-channel-collection-logic:
    description: |
      Collection logic applied to the sub-channel umbrella. Defaults to
      AGGREGATE_LATEST_VERSION_CHILDREN.
    required: false
    default: AGGREGATE_LATEST_VERSION_CHILDREN

runs:
  using: composite
  steps:
    - name: Bootstrap hierarchy
      shell: pwsh
      env:
        DT_SERVER_URL: ${{ inputs.server-url }}
        DT_API_KEY: ${{ inputs.api-key }}
        DT_DOMAIN: ${{ inputs.domain }}
        DT_SYSTEM: ${{ inputs.system }}
        DT_COMPONENT: ${{ inputs.component }}
        DT_CHANNEL: ${{ inputs.channel }}
        DT_SUBCHANNEL: ${{ inputs.sub-channel }}
        DT_CLASSIFIER: ${{ inputs.classifier }}
        DT_DOMAIN_COLLECTION_LOGIC: ${{ inputs.domain-collection-logic }}
        DT_SYSTEM_COLLECTION_LOGIC: ${{ inputs.system-collection-logic }}
        DT_COMPONENT_COLLECTION_LOGIC: ${{ inputs.component-collection-logic }}
        DT_CHANNEL_COLLECTION_LOGIC: ${{ inputs.channel-collection-logic }}
        DT_SUBCHANNEL_COLLECTION_LOGIC: ${{ inputs.sub-channel-collection-logic }}
      run: |
        $params = @{
          ServerUrl                 = $env:DT_SERVER_URL
          ApiKey                    = $env:DT_API_KEY
          Domain                    = $env:DT_DOMAIN
          System                    = $env:DT_SYSTEM
          Component                 = $env:DT_COMPONENT
          Channel                   = $env:DT_CHANNEL
          Classifier                = $env:DT_CLASSIFIER
          DomainCollectionLogic     = $env:DT_DOMAIN_COLLECTION_LOGIC
          SystemCollectionLogic     = $env:DT_SYSTEM_COLLECTION_LOGIC
          ComponentCollectionLogic  = $env:DT_COMPONENT_COLLECTION_LOGIC
          ChannelCollectionLogic    = $env:DT_CHANNEL_COLLECTION_LOGIC
          SubChannelCollectionLogic = $env:DT_SUBCHANNEL_COLLECTION_LOGIC
        }
        if ($env:DT_SUBCHANNEL) {
          $params.SubChannel = $env:DT_SUBCHANNEL
        }
        & "$env:GITHUB_ACTION_PATH/../../../../scripts/dependency-track/Initialize-DTHierarchy.ps1" @params
