# Prune stale child projects under a Dependency-Track parent, keeping only the
# most recent N.
#
# Wraps scripts/dependency-track/Remove-DTStaleChildren.ps1. Designed for long-lived
# per-commit child hierarchies where the child list would otherwise grow unbounded.
# The DT API key needs PORTFOLIO_MANAGEMENT to delete projects; lower-privilege
# keys hit HTTP 403 and the script aborts with an actionable error.

parameters:
  - name: scriptsDir
    displayName: Path to the pipeline-tools scripts/ directory after checkout.
    type: string
  - name: serverUrl
    displayName: Dependency-Track base URL including scheme.
    type: string
  - name: apiKey
    displayName: Dependency-Track API key. Mark the source variable as a secret.
    type: string
  - name: parentName
    displayName: Parent project name.
    type: string
  - name: parentVersion
    displayName: Parent project version.
    type: string
  - name: keep
    displayName: Number of most recent children to retain.
    # Typed as string (not number) so callers can pass an ADO runtime variable
    # like `$(__dtComposite_PruneKeep)`. ADO can't validate a $() expression
    # against type:number at compile time; the script casts via [int] at runtime.
    type: string
    default: '10'
  - name: displayName
    displayName: Pipeline UI label for the generated step.
    type: string
    default: Prune stale child projects in Dependency-Track
  - name: condition
    displayName: Optional ADO condition expression. Empty means always run on success.
    type: string
    default: ''

steps:
  - pwsh: |
      & "${{ parameters.scriptsDir }}/dependency-track/Remove-DTStaleChildren.ps1" `
        -ServerUrl     $env:DT_SERVER_URL `
        -ApiKey        $env:DT_API_KEY `
        -ParentName    $env:DT_PARENT_NAME `
        -ParentVersion $env:DT_PARENT_VERSION `
        -Keep          ([int]$env:DT_KEEP)
    env:
      DT_SERVER_URL:     ${{ parameters.serverUrl }}
      DT_API_KEY:        ${{ parameters.apiKey }}
      DT_PARENT_NAME:    ${{ parameters.parentName }}
      DT_PARENT_VERSION: ${{ parameters.parentVersion }}
      DT_KEEP:           ${{ parameters.keep }}
    displayName: ${{ parameters.displayName }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
