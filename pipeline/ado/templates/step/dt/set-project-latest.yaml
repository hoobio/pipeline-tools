# Mark a Dependency-Track project version as the "latest" for its name.
#
# Wraps scripts/dependency-track/Set-DTProjectLatest.ps1. Use for canonical release
# projects, not transient per-commit children: DT's isLatest flag is name-scoped, so
# setting it here automatically clears it on whichever version held it before.

parameters:
  - name: scriptsDir
    displayName: Path to the pipeline-tools scripts/ directory after checkout.
    type: string
  - name: serverUrl
    displayName: Dependency-Track base URL including scheme.
    type: string
  - name: apiKey
    displayName: Dependency-Track API key. Mark the source variable as a secret.
    type: string
  - name: projectName
    displayName: Project name to look up.
    type: string
  - name: projectVersion
    displayName: Project version to mark as latest.
    type: string
  - name: displayName
    displayName: Pipeline UI label for the generated step.
    type: string
    default: Mark project as latest in Dependency-Track
  - name: condition
    displayName: Optional ADO condition expression. Empty means always run on success.
    type: string
    default: ''

steps:
  - pwsh: |
      & "${{ parameters.scriptsDir }}/dependency-track/Set-DTProjectLatest.ps1" `
        -ServerUrl      $env:DT_SERVER_URL `
        -ApiKey         $env:DT_API_KEY `
        -ProjectName    $env:DT_PROJECT_NAME `
        -ProjectVersion $env:DT_PROJECT_VERSION
    env:
      DT_SERVER_URL:      ${{ parameters.serverUrl }}
      DT_API_KEY:         ${{ parameters.apiKey }}
      DT_PROJECT_NAME:    ${{ parameters.projectName }}
      DT_PROJECT_VERSION: ${{ parameters.projectVersion }}
    displayName: ${{ parameters.displayName }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
