# Upload a CycloneDX BOM to Dependency-Track. Optionally links the upload to a
# parent project (use the channel umbrella from the hierarchy bootstrap step).
#
# Wraps scripts/dependency-track/Send-DTBom.ps1. Returns the DT upload token as a
# step output variable named `uploadToken` (masked). Set `name` on this template
# in the consumer to address the output, e.g.:
#
#   - template: pipeline/ado/templates/step/dt/send-bom.yaml@pipeline_tools
#     parameters:
#       stepName:       upload
#       scriptsDir:     $(Build.SourcesDirectory)/pipeline_tools/scripts
#       serverUrl:      $(dtServerUrl)
#       apiKey:         $(dtApiKey)
#       projectName:    hoobi-automation
#       projectVersion: $(Build.SourceVersion)
#       parentName:     hoobi-automation
#       parentVersion:  release
#       bomPath:        $(Build.ArtifactStagingDirectory)/sbom.cdx.json
#
#   - script: echo "uploaded with token $(upload.uploadToken)"

parameters:
  - name: scriptsDir
    displayName: Path to the pipeline-tools scripts/ directory after checkout.
    type: string
  - name: serverUrl
    displayName: Dependency-Track base URL including scheme.
    type: string
  - name: apiKey
    displayName: Dependency-Track API key. Mark the source variable as a secret.
    type: string
  - name: projectName
    displayName: Target project name.
    type: string
  - name: projectVersion
    displayName: Target project version (typically the commit SHA).
    type: string
  - name: bomPath
    displayName: Path to the CycloneDX BOM file (JSON or XML).
    type: string
  - name: parentName
    displayName: Optional parent project name for linkage. Empty to skip.
    type: string
    default: ''
  - name: parentVersion
    displayName: Optional parent project version for linkage. Empty to skip.
    type: string
    default: ''
  - name: projectTags
    displayName: Comma-separated tags applied to the project (DT 4.12+).
    type: string
    default: ''
  - name: autoCreate
    displayName: Create the project on DT if it does not yet exist.
    type: boolean
    default: true
  - name: stepName
    displayName: ADO step name. Required to address the uploadToken output.
    type: string
    default: dtUpload
  - name: displayName
    displayName: Pipeline UI label for the generated step.
    type: string
    default: Upload BOM to Dependency-Track
  - name: condition
    displayName: Optional ADO condition expression. Empty means always run on success.
    type: string
    default: ''

steps:
  # Values are passed through env: so secret variables (apiKey) and any
  # consumer-supplied $(varName) references are expanded by ADO at runtime,
  # not pasted into the script body where unmapped names trip PowerShell.
  - pwsh: |
      $params = @{
        ServerUrl      = $env:DT_SERVER_URL
        ApiKey         = $env:DT_API_KEY
        ProjectName    = $env:DT_PROJECT_NAME
        ProjectVersion = $env:DT_PROJECT_VERSION
        BomPath        = $env:DT_BOM_PATH
      }
      if ($env:DT_PARENT_NAME -and $env:DT_PARENT_VERSION) {
        $params.ParentName    = $env:DT_PARENT_NAME
        $params.ParentVersion = $env:DT_PARENT_VERSION
      }
      if ($env:DT_PROJECT_TAGS) {
        $params.ProjectTags = $env:DT_PROJECT_TAGS
      }
      if ($env:DT_AUTO_CREATE -ieq 'true') {
        $params.AutoCreate = $true
      }

      $response = & "${{ parameters.scriptsDir }}/dependency-track/Send-DTBom.ps1" @params
      if ($response -and $response.token) {
        Write-Host "##vso[task.setvariable variable=uploadToken;isOutput=true;issecret=true]$($response.token)"
      }
    env:
      DT_SERVER_URL:      ${{ parameters.serverUrl }}
      DT_API_KEY:         ${{ parameters.apiKey }}
      DT_PROJECT_NAME:    ${{ parameters.projectName }}
      DT_PROJECT_VERSION: ${{ parameters.projectVersion }}
      DT_BOM_PATH:        ${{ parameters.bomPath }}
      DT_PARENT_NAME:     ${{ parameters.parentName }}
      DT_PARENT_VERSION:  ${{ parameters.parentVersion }}
      DT_PROJECT_TAGS:    ${{ parameters.projectTags }}
      DT_AUTO_CREATE:     ${{ parameters.autoCreate }}
    name: ${{ parameters.stepName }}
    displayName: ${{ parameters.displayName }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
