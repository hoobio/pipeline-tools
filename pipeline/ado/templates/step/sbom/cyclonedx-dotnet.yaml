# Generate a CycloneDX BOM for a .NET solution or project. Backward-compat
# wrapper kept for v1 consumers: delegates to the generic
# step/sbom/build-cyclonedx-sbom.yaml with appLanguage=dotnet. New consumers
# should use build-cyclonedx-sbom.yaml directly so they can opt into the
# container/application merge flow.
#
# Example:
#
#   resources:
#     repositories:
#       - repository: pipeline_tools
#         type: github
#         name: hoobio/pipeline-tools
#         ref: refs/tags/v2.0.0
#         endpoint: hoobio
#
#   steps:
#     - checkout: pipeline_tools
#     - template: pipeline/ado/templates/step/sbom/cyclonedx-dotnet.yaml@pipeline_tools
#       parameters:
#         scriptsDir:   $(Build.SourcesDirectory)/pipeline_tools/scripts
#         solutionPath: $(Build.SourcesDirectory)/$(Build.Repository.Name)/MySolution.sln
#         outputPath:   $(Build.ArtifactStagingDirectory)/sbom.cdx.json

parameters:
  - name: scriptsDir
    displayName: Path to the pipeline-tools scripts/ directory after checkout.
    type: string
  - name: solutionPath
    displayName: Path to the .sln, .slnx, or .csproj to scan.
    type: string
  - name: outputPath
    displayName: Destination path for the generated CycloneDX JSON BOM.
    type: string
  - name: specVersion
    displayName: CycloneDX spec version to emit (e.g. 1.5, 1.6).
    type: string
    default: '1.6'
  - name: toolVersion
    displayName: Pinned dotnet CycloneDX tool version.
    type: string
    default: 6.1.1
  - name: displayName
    displayName: Pipeline UI label for the generated step.
    type: string
    default: Generate CycloneDX BOM (.NET)

steps:
  - template: build-cyclonedx-sbom.yaml
    parameters:
      scriptsDir:        ${{ parameters.scriptsDir }}
      appLanguage:       dotnet
      appManifestPath:   ${{ parameters.solutionPath }}
      dotnetSpecVersion: ${{ parameters.specVersion }}
      dotnetToolVersion: ${{ parameters.toolVersion }}
      outputPath:        ${{ parameters.outputPath }}
      displayName:       ${{ parameters.displayName }}
